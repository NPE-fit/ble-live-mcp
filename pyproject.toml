[project]
name = "ble-live-mcp"
version = "0.1.0"
description = "MCP server and Python library for NPE's BLE Live protocol: spec tables, frame codec, 0xFD crypto, rotation planner, design lints, receiver scaffolds, firmware generator and bench tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "North Pole Engineering, Inc.", email = "npe@npe-inc.com" }]
keywords = ["ble", "bluetooth", "advertising", "fitness", "mcp", "model-context-protocol", "npe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Networking",
]
dependencies = [
    "openpyxl>=3.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
bench = [
    "pyserial>=3.5",
    "bleak>=0.22",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/NPE-fit/ble-live-mcp"
Issues = "https://github.com/NPE-fit/ble-live-mcp/issues"
Specification = "https://cdn.shopify.com/s/files/1/0558/2074/6861/files/ble-live-protocol.pdf"

[project.scripts]
ble-live = "ble_live.cli:main"
ble-live-mcp = "ble_live.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ble_live"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# scaffold.py holds C, C#, Kotlin and Swift source as template strings
"src/ble_live/scaffold.py" = ["E501"]
