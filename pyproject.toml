[project]
name = "ble-live"
version = "0.1.0"
description = "BLE Live protocol library and MCP server: spec tables, codec, rotation planner, design lints and the firmware code generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "North Pole Engineering, Inc.", email = "npe@npe-inc.com" }]
dependencies = [
    "openpyxl>=3.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
ble-live = "ble_live.cli:main"
ble-live-mcp = "ble_live.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ble_live"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# scaffold.py holds C, C#, Kotlin and Swift source as template strings
"src/ble_live/scaffold.py" = ["E501"]
